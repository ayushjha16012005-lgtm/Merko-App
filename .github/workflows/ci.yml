name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prisma Validate
        run: pnpm --filter @merko/api prisma:validate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/merko
          DIRECT_URL: postgresql://postgres:password@localhost:5432/merko

      - name: Lint Checks
        run: pnpm lint

      - name: Type Checks
        run: pnpm typecheck

      - name: Build Projects
        run: pnpm build
